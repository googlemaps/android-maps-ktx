name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNCED_GITHUB_TOKEN_REPO }}
          
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
          
      - name: Create .gpg key
        run: |
          echo "$GPG_KEY_ARMOR" | base64 --decode > ./release.asc
          gpg --quiet --output "$GITHUB_WORKSPACE/release.gpg" --dearmor ./release.asc

          sed -i -e "s,signing.keyId=,signing.keyId=$GPG_KEY_ID,g" gradle.properties
          sed -i -e "s,signing.password=,signing.password=$GPG_PASSWORD,g" gradle.properties
          sed -i -e "s,signing.secretKeyRingFile=,signing.secretKeyRingFile=$GITHUB_WORKSPACE/release.gpg,g" gradle.properties
        env:
          GPG_KEY_ARMOR: ${{ secrets.SYNCED_GPG_KEY_ARMOR }}
          GPG_KEY_ID: ${{ secrets.SYNCED_GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.SYNCED_GPG_KEY_PASSWORD }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Clean up prior staged artifacts in OSS Exit Gate repository
        run: |
          set -euo pipefail
          EXISTING_PKGS="$(gcloud artifacts packages list \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=android-maps-ktx--mavencentral \
            --format='value(name)' 2>/dev/null || true)"
          for pkg in ${EXISTING_PKGS}; do
            gcloud artifacts packages delete "${pkg}" \
              --project=oss-exit-gate-prod \
              --location=us \
              --repository=android-maps-ktx--mavencentral \
              --quiet || true
          done

      - name: Stage signed artifacts to OSS Exit Gate
        run: |
          set -euo pipefail
          set +x
          INIT_SCRIPT="$(mktemp "${RUNNER_TEMP}/exit-gate-init.XXXXXX.gradle")"
          trap 'rm -f "${INIT_SCRIPT}"' EXIT
          cat <<'EOF' > "${INIT_SCRIPT}"
          allprojects {
            afterEvaluate { proj ->
              if (proj.plugins.hasPlugin('maven-publish')) {
                proj.publishing.repositories.maven {
                  name = 'ExitGateArtifactRegistry'
                  url = uri('https://us-maven.pkg.dev/oss-exit-gate-prod/android-maps-ktx--mavencentral')
                  credentials {
                    username = 'oauth2accesstoken'
                    password = System.getenv('AR_ACCESS_TOKEN')
                  }
                }
              }
            }
          }
          EOF
          export AR_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          ./gradlew --no-daemon \
            --init-script "${INIT_SCRIPT}" \
            publishAllPublicationsToExitGateArtifactRegistryRepository \
            --warn --stacktrace
          unset AR_ACCESS_TOKEN

      - name: Trigger OSS Exit Gate Maven Central release
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cat <<'EOF' > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "namespace": "com.google.maps.android",
                "packages": [
                { "name": "maps-ktx" },
                { "name": "maps-utils-ktx" }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/android-maps-ktx/mavencentral/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
